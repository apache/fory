name: Recover RC3 Nexus Staging

on:
  push:
    branches: [recover/rc3-nexus-close]
    paths: [.github/workflows/recover-nexus-staging.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-release-candidate
  cancel-in-progress: false

jobs:
  close-jvm:
    if: github.repository == 'apache/fory'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout unchanged release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.7.8-rc3
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate and public signing key
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e2fc5742c8f21ca01b556b2423208e5977de5ca0
          curl --fail --location --retry 3 --max-time 30 \
            'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x36A8FDFFA7A40EA5' \
            --output "$RUNNER_TEMP/fory-ci-public.asc"
          fingerprint="$(gpg --show-keys --with-colons "$RUNNER_TEMP/fory-ci-public.asc" | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = C1FE86839CEDF2E023F4D9DF36A8FDFFA7A40EA5

      - name: Close and verify existing JVM repositories
        shell: bash
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_STAGE_DEPLOYER_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_STAGE_DEPLOYER_PW }}
        run: |
          set -euo pipefail
          python3 ci/release.py close_jvm_staging \
            -v 1.7.8 --rc-tag v1.7.8-rc3 \
            --java-kotlin-id orgapachefory-1142 \
            --scala-id orgapachefory-1143
