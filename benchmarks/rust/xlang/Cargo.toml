[package]
name = "fory-rust-xlang-benchmarks"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fory_profiler"
path = "src/main.rs"

[[bench]]
name = "serialization_bench"
path = "benches/serialization_bench.rs"
harness = false

[dependencies]
clap = { version = "4.0", features = ["derive"] }
criterion = "0.5"
fory = { path = "../../../rust/fory" }
fory-derive = { path = "../../../rust/fory-derive" }
prost = "0.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
prost-build = "0.12"
