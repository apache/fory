project:
  metadata:
    key: fory
    committee: fory
    name: Apache Fory
  policy:
    # These vendored files retain upstream notices documented in LICENSE.
    # Restrict exceptions to the matching files in Fory source archives.
    source_excludes_lightweight:
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/cpp/fory/thirdparty/MurmurHash3.cc"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/cpp/fory/thirdparty/MurmurHash3.h"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/collection/ForyObjectMap.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/collection/IdentityMap.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/collection/IdentityObjectIntMap.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/collection/LongLongByteMap.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/collection/LongMap.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/collection/ObjectIntMap.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/reflect/TypeParameter.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/reflect/TypeRef.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/type/Generics.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/util/MurmurHash3.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/util/Preconditions.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/main/java/org/apache/fory/util/concurrency/DirectExecutorService.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/java/fory-core/src/test/java/org/apache/fory/type/GenericsTest.java"
      - "/apache-fory-*-src.tar.gz/apache-fory-*-src/javascript/packages/core/lib/murmurHash3.ts"

github:
  description: >-
    A blazingly fast multi-language serialization framework for idiomatic domain objects, schema IDL, and cross-language data exchange.
  homepage: https://fory.apache.org
  labels:
    - javascript
    - python
    - java
    - rust
    - fast
    - golang
    - encoding
    - serialization
    - compression
    - lightning
    - cpp
    - transfer
    - zero-copy
    - persistence
    - marshalling
    - jit
    - rpc
    - hacktoberfest
    - cross-language
    - multiple-language
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  protected_branches:
    main:
      required_status_checks:
        strict: false
      required_pull_request_reviews:
        dismiss_stale_reviews: false
        required_approving_review_count: 1
    releases-0.4.1: {}
    releases-0.4.0: {}
    releases-0.3.1: {}
    releases-0.3.0: {}
    releases-0.2.1: {}
    releases-0.2.0: {}
    releases-0.1.2: {}

notifications:
  commits: commits@fory.apache.org
  issues: commits@fory.apache.org
  pullrequests: commits@fory.apache.org
  jobs: commits@fory.apache.org
  discussions: commits@fory.apache.org
